<form method="post" novalidate>
  {% csrf_token %}
  {% if form.non_field_errors %}
    <div class="alert error">
      {% for e in form.non_field_errors %}<div>{{ e }}</div>{% endfor %}
    </div>
  {% endif %}
  {% for field in form %}
    <div class="field">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% for e in field.errors %}<small class="error-text">{{ e }}</small>{% endfor %}
    </div>
  {% endfor %}
  <button type="submit">{{ button|default:"Submit" }}</button>
  <a class="btn-link" href="{% url 'bank:home' %}">Cancel</a>
</form>
